name: Build Q5NasBrowser APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android cmdline-tools + SDK platform/build-tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p /tmp/cmdtools_extract
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r /tmp/cmdtools_extract/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.9 (AGP 8.4 requires Gradle >= 8.6)
        run: |
          curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build error as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          LOG=$(grep -iE "error:|e: |FAILURE|What went wrong|Exception in|Could not resolve|unresolved reference|w: |Task :app" build.log | head -150)
          BODY=$(python3 -c "import sys,json; log=sys.stdin.read(); print(json.dumps('**Build error (auto-published):**\n\n\`\`\`\n'+log+'\n\`\`\`'))" <<< "$LOG")
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/commits/$GH_SHA/comments" \
            -d "{\"body\":$BODY}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q5nasbrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
