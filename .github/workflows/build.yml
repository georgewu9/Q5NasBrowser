name: Build Q5NasBrowser APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android cmdline-tools + SDK platform/build-tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p /tmp/cmdtools_extract
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r /tmp/cmdtools_extract/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.4
        run: |
          curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q5nasbrowser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
